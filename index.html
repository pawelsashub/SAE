<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAE – SAS AI Ecosystem</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c2a33">
  <meta name="apple-mobile-web-app-title" content="SAE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#">
        <img src="logo.svg" alt="" width="40" height="40">
        <span>
          <strong>SAE</strong>
          <small>SAS AI Ecosystem</small>
        </span>
      </a>
      <nav class="modules" aria-label="Moduły">
        <p class="nav-label">Moduły</p>
        <a class="module is-active" href="#" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 9 12 14l9.5-5L12 4Z"/><path d="M6.5 11.5V16c0 1.4 2.5 3 5.5 3s5.5-1.6 5.5-3v-4.5"/></svg>
          AI Academy
        </a>
        <p class="nav-hint">Kolejne moduły pojawią się tutaj.</p>
      </nav>
      <button class="conn" id="connBtn" type="button"><span class="dot" id="connDot"></span>Połączenie</button>
    </aside>

    <main class="main">
      <header class="head">
        <div>
          <h1>AI Academy</h1>
          <p class="sub">Co chcę przerobić ja i czego ma się nauczyć mój system AI.</p>
        </div>
        <button class="btn primary" id="addBtn" type="button">+ Dodaj</button>
      </header>

      <div class="demo" id="banner" role="status"></div>

      <div class="tabs" role="tablist">
        <button role="tab" class="tab" data-tab="me" type="button">Me to Learn <span class="count" id="countMe"></span></button>
        <button role="tab" class="tab" data-tab="claude" type="button">Claude to Learn <span class="count" id="countClaude"></span></button>
      </div>

      <div class="tools">
        <input id="search" type="search" placeholder="Szukaj…" aria-label="Szukaj">
        <select id="statusFilter" aria-label="Status"></select>
        <a id="sheetLink" class="sheet-link" target="_blank" rel="noopener">Otwórz arkusz ↗</a>
      </div>

      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>Brak pozycji dla tych filtrów.</p>
    </main>
  </div>

  <dialog id="detail" class="dialog"></dialog>
  <dialog id="form" class="dialog"></dialog>
  <dialog id="conn" class="dialog"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
