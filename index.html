<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAE – SAS AI Ecosystem</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c2a33">
  <meta name="apple-mobile-web-app-title" content="SAE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#">
        <img src="logo.svg" alt="" width="40" height="40">
        <span>
          <strong>SAE</strong>
          <small>SAS AI Ecosystem</small>
        </span>
      </a>
      <nav class="modules" id="modules" aria-label="Moduły"></nav>
      <button class="conn" id="connBtn" type="button" aria-label="Połączenie"><span class="dot" id="connDot"></span><span class="conn-label">Połączenie</span></button>
    </aside>

    <main class="main">
      <header class="head">
        <div>
          <h1 id="title"></h1>
          <p class="sub" id="sub"></p>
        </div>
        <button class="btn primary" id="addBtn" type="button">+ Dodaj</button>
      </header>

      <div class="demo" id="banner" role="status"></div>

      <div class="company" id="companyBar" hidden>
        <label for="company">Firma</label>
        <select id="company"></select>
        <span id="mapStateBox" class="company-part">
        <label for="mapState">Mapa</label>
        <select id="mapState">
          <option value="current">Aktualna</option>
          <option value="target">Docelowa</option>
          <option value="both">Obie obok siebie</option>
        </select>
        </span>
      </div>

      <div class="tabs" id="tabs" role="tablist"></div>

      <div class="tools">
        <input id="search" type="search" placeholder="Szukaj…" aria-label="Szukaj">
        <select id="statusFilter" aria-label="Status"></select>
        <select id="groupBy" aria-label="Układ mapy" hidden></select>
        <a id="sheetLink" class="sheet-link" target="_blank" rel="noopener">Otwórz arkusz ↗</a>
      </div>

      <ul class="list" id="list"></ul>
      <div class="map" id="map" hidden></div>
      <div class="table-wrap" id="table" hidden></div>
      <p class="empty" id="empty" hidden>Brak pozycji dla tych filtrów.</p>
    </main>
  </div>

  <dialog id="detail" class="dialog"></dialog>
  <dialog id="form" class="dialog"></dialog>
  <dialog id="conn" class="dialog"></dialog>

  <script type="module" src="app.js?v=11"></script>
</body>
</html>
